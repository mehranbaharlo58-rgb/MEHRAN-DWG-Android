name: Build SMART SITE Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "smart-site/**"
      - ".github/workflows/smart-site-android.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smart-site/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Build web bundle
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync native plugins
        run: npx cap sync android
      - name: Build debug APK
        working-directory: smart-site/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-site-android-debug
          path: smart-site/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
