name: Deploy SMART SITE PWA

on:
  push:
    branches: [main]
    paths:
      - "smart-site/**"
      - ".github/workflows/smart-site-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: smart-site-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: smart-site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
