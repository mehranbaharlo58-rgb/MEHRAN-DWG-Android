name: Deploy SMART SITE PWA

on:
  push:
    branches: [main]
    paths:
      - "smart-site/**"
      - ".github/workflows/smart-site-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: smart-site-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smart-site/package.json
      - name: Install dependencies
        run: npm install
      - name: Build PWA bundle
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: smart-site/dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
